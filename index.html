<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>강무성 & 정수연 결혼식에 초대합니다</title>
  
  <style>
    /* ─── Reset & Variables ─── */
    :root {
      --bg-color: #faf8f5;
      --text-color: #3a3228;
      --accent-color: #b8956a;
      --font-serif: 'Noto Serif KR', serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: var(--bg-color); color: var(--text-color); font-family: sans-serif; overflow-x: hidden; }
    
    /* 이미지 꾹 누르기/드래그 방지 */
    img {
      display: block;
      max-width: 100%;
      height: auto;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-user-drag: none !important;
    }

    /* ─── Curtain Layer ─── */
    .curtain {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .curtain__panel {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: #3a3228;
      transition: transform 1s ease-in-out;
    }
    .curtain__panel--left { left: 0; }
    .curtain__panel--right { right: 0; }
    
    .curtain.is-open .curtain__panel--left { transform: translateX(-100%); }
    .curtain.is-open .curtain__panel--right { transform: translateX(100%); }
    .curtain.is-open .curtain__content { opacity: 0; pointer-events: none; }
    .curtain.is-hidden { display: none !important; }

    .curtain__content {
      position: relative;
      z-index: 100000;
      text-align: center;
      color: #ffffff;
      transition: opacity 0.5s ease;
    }
    .curtain__names {
      font-size: 1.5rem;
      letter-spacing: 4px;
      margin-bottom: 2rem;
    }
    .curtain__btn {
      padding: 0.8rem 2rem;
      border: 1px solid rgba(255,255,255,0.6);
      background: transparent;
      color: #ffffff;
      font-size: 0.9rem;
      letter-spacing: 2px;
      cursor: pointer;
      pointer-events: auto !important;
    }

    /* ─── Main Content ─── */
    .container {
      max-width: 450px;
      margin: 0 auto;
      padding: 2rem 1rem;
      text-align: center;
    }
    .hero__photo {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
    .title {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .date {
      color: #7a7068;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-top: 2rem;
    }
    .gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div id="curtain" class="curtain">
    <div class="curtain__panel curtain__panel--left"></div>
    <div class="curtain__panel curtain__panel--right"></div>
    <div class="curtain__content">
      <div id="curtainNames" class="curtain__names">강무성 & 정수연</div>
      <button id="curtainBtn" class="curtain__btn" type="button">청첩장 열기</button>
    </div>
  </div>

  <div class="container">
    <img src="images/hero/1.jpg" alt="메인 사진" class="hero__photo" onerror="this.style.display='none'">
    <h1 class="title">강무성 & 정수연</h1>
    <p class="date">결혼식에 초대합니다</p>
    
    <div class="gallery">
      <img src="images/gallery/1.jpg" alt="갤러리 1" onerror="this.style.display='none'">
      <img src="images/gallery/2.jpg" alt="갤러리 2" onerror="this.style.display='none'">
      <img src="images/gallery/3.jpg" alt="갤러리 3" onerror="this.style.display='none'">
    </div>
  </div>

  <script>
    // 클릭 이벤트 및 커튼 동작
    document.addEventListener('DOMContentLoaded', function() {
      const curtain = document.getElementById('curtain');
      const curtainBtn = document.getElementById('curtainBtn');

      if (curtainBtn && curtain) {
        curtainBtn.addEventListener('click', function(e) {
          e.preventDefault();
          curtain.classList.add('is-open');
          
          setTimeout(function() {
            curtain.classList.add('is-hidden');
          }, 1000);
        });
      }
    });
  </script>
</body>
</html>
